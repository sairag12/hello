name: Java CI/CD Enterprise Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  
  # Adds the native dropdown selection menu inside the GitHub Actions UI portal
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Step 1: Restore the previous build's coverage score if it exists
    - name: Restore Previous Coverage Score
      id: cache-coverage
      uses: actions/cache/restore@v4
      with:
        path: .coverage_history
        key: coverage-${{ github.run_id }}
        restore-keys: |
          coverage-

    # Step 2: Build and Test with Active Profile
    # Maps the dropdown choice value to Spring Boot's profile variable during maven test phases
    # Default fallback to 'dev' profile if triggered automatically via code push instead of dropdown
    - name: Build and Test with Active Profile
      run: |
        SELECTED_ENV="${{ github.event.inputs.environment }}"
        TARGET_PROFILE=${SELECTED_ENV:-dev}
        echo "Executing verification flow against target profile: $TARGET_PROFILE"
        mvn -B clean test package verify -Dspring.profiles.active=$TARGET_PROFILE --file pom.xml

    - name: Run Snyk Security Scan
      continue-on-error: true
      uses: snyk/actions/maven@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: SonarQube Static Analysis
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B sonar:sonar \
          -Dsonar.projectKey=sairag12_hello \
          -Dsonar.organization=sairag12 \
          -Dsonar.host.url=https://sonarcloud.io

    - name: Compare and Publish Coverage Table
      if: always()
      run: |
        if [ -f target/site/jacoco/jacoco.csv ]; then
          CURRENT_SCORE=$(cat target/site/jacoco/jacoco.csv | awk -F, 'NR>1 {inst_m+=$4; inst_c+=$5} END {if (inst_m+inst_c > 0) printf "%.2f", (inst_c/(inst_m+inst_c))*100; else print "0";}')
          PREV_SCORE="N/A"
          if [ -f .coverage_history/last_score.txt ]; then
            PREV_SCORE=$(cat .coverage_history/last_score.txt)
          fi
          if [ "$PREV_SCORE" != "N/A" ]; then
            DIFF=$(echo "$CURRENT_SCORE - $PREV_SCORE" | bc 2>/dev/null || awk "BEGIN {print $CURRENT_SCORE - $PREV_SCORE}")
            if (( $(echo "$DIFF > 0" | bc -l 2>/dev/null || awk "BEGIN {print ($DIFF > 0)?1:0}") )); then
              TREND="🟢 +$DIFF%"
            elif (( $(echo "$DIFF < 0" | bc -l 2>/dev/null || awk "BEGIN {print ($DIFF < 0)?1:0}") )); then
              TREND="🔴 $DIFF%"
            else
              TREND="⚪ No Change"
            fi
          else
            TREND="🆕 First Tracked Run"
          fi
          echo "### 📊 JaCoCo Code Coverage Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Phase | Coverage Score |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Run | \`$PREV_SCORE%\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Current Run** | **$CURRENT_SCORE%** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trend Status** | $TREND |" >> $GITHUB_STEP_SUMMARY
          mkdir -p .coverage_history
          echo "$CURRENT_SCORE" > .coverage_history/last_score.txt
        else
          echo "### ⚠️ Error: JaCoCo CSV data report asset not found." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Save Current Coverage Score to Cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .coverage_history
        key: coverage-${{ github.run_id }}

  # Step 3: Simulated Enterprise Deployment Gate Route
  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' # Runs only if triggered via the dropdown menu choice selection
    runs-on: ubuntu-latest
    steps:
    - name: Execute Deployment Orchestration
      run: |
        echo "🚀 Initializing deployment workflow routing infrastructure..."
        echo "🎯 Target Environment Selected: ${{ github.event.inputs.environment }}"
        echo "📦 Packaging Spring Boot compiled artifact container image tier..."
        echo "✅ Successfully deployed application context to environment cluster stack!"
