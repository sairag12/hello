name: Java CI with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Updated: Changed 'package' to 'clean test package' so JaCoCo generates reports
    - name: Build and Test with Maven
      run: mvn -B clean test package --file pom.xml

    # New Step: Parses the generated JaCoCo report and prints the score to the screen
    - name: Log JaCoCo Code Coverage Score
      run: |
        echo "=== JACOCO COVERAGE SUMMARY ==="
        if [ -f target/site/jacoco/jacoco.csv ]; then
          cat target/site/jacoco/jacoco.csv | awk -F, 'NR>1 {instructions_missed+=$4; instructions_covered+=$5} END {if (instructions_missed+instructions_covered > 0) print "Total Line/Instruction Coverage: " (instructions_covered/(instructions_missed+instructions_covered))*100 "%"; else print "No instructions found to calculate coverage.";}'
        else
          echo "Error: JaCoCo report not found. Make sure jacoco-maven-plugin is configured in your pom.xml!"
        fi
