name: Java CI/CD Enterprise Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target Deployment Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Restore Previous Coverage Score
      id: cache-coverage
      uses: actions/cache/restore@v4
      with:
        path: .coverage_history
        key: coverage-${{ github.run_id }}
        restore-keys: |
          coverage-

    # Step 1: Initialize CodeQL Framework Tools (Required before compilation starts)
    - name: Initialize CodeQL Engine
      uses: github/codeql-action/init@v3
      with:
        languages: 'java-kotlin'
        queries: security-extended,security-and-quality

    # Step 2: Compile & Test Code (Forcing the 'test' profile to use the In-Memory H2 DB)
    - name: Build and Test with Active Profile
      run: |
        echo "Executing verification flow against test profile..."
        mvn -B clean test package verify -Dspring.profiles.active=test --file pom.xml

    # Step 3: Run the CodeQL Static Application Security Testing (SAST) Core Engine Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java-kotlin"

    # Step 4: Setup Snyk CLI (FOSS / Software Supply Chain Security Layer)
    - name: Setup Snyk CLI Natively
      uses: snyk/actions/setup@master

    # Step 5: Execute FOSS / SCA Dependency Scan & Output Security Graph Assets
    - name: Run Snyk FOSS Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        echo "Executing Snyk FOSS scan utilizing native runner environment variables..."
        snyk test --severity-threshold=high

    - name: SonarQube Static Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B sonar:sonar \
          -Dsonar.projectKey=sairag12_hello \
          -Dsonar.organization=sairag12 \
          -Dsonar.host.url=https://sonarcloud.io

    - name: Compare and Publish Coverage Table
      if: always()
      run: |
        if [ -f target/site/jacoco/jacoco.csv ]; then
          CURRENT_SCORE=$(cat target/site/jacoco/jacoco.csv | awk -F, 'NR>1 {inst_m+=$4; inst_c+=$5} END {if (inst_m+inst_c > 0) printf "%.2f", (inst_c/(inst_m+inst_c))*100; else print "0";}')
          PREV_SCORE="N/A"
          if [ -f .coverage_history/last_score.txt ]; then
            PREV_SCORE=$(cat .coverage_history/last_score.txt)
          fi
          if [ "$PREV_SCORE" != "N/A" ]; then
            DIFF=$(echo "$CURRENT_SCORE - $PREV_SCORE" | bc 2>/dev/null || awk "BEGIN {print $CURRENT_SCORE - $PREV_SCORE}")
            if (( $(echo "$DIFF > 0" | bc -l 2>/dev/null || awk "BEGIN {print ($DIFF > 0)?1:0}") )); then
              TREND="🟢 +$DIFF%"
            elif (( $(echo "$DIFF < 0" | bc -l 2>/dev/null || awk "BEGIN {print ($DIFF < 0)?1:0}") )); then
              TREND="🔴 $DIFF%"
            else
              TREND="⚪ No Change"
            fi
          else
            TREND="🆕 First Tracked Run"
          fi
          echo "### 📊 JaCoCo Code Coverage Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Phase | Coverage Score |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Run | \`$PREV_SCORE%\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Current Run** | **$CURRENT_SCORE%** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trend Status** | $TREND |" >> $GITHUB_STEP_SUMMARY
          mkdir -p .coverage_history
          echo "$CURRENT_SCORE" > .coverage_history/last_score.txt
        else
          echo "### ⚠️ Error: JaCoCo CSV data report asset not found." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Save Current Coverage Score to Cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .coverage_history
        key: coverage-${{ github.run_id }}

  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Live Cloud Deployment via Webhook
      env:
        RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
      run: |
        echo "🚀 Initializing dynamic deployment workflow routing..."
        if [ -z "$RENDER_HOOK" ]; then
          echo "❌ ERROR: RENDER_DEPLOY_HOOK_PROD secret is completely missing in GitHub Secrets!"
          exit 1
        fi
        
        echo "📦 Dispatching authenticated, secured webhook signal straight to Render..."
        RESPONSE=$(curl -s -w "%{http_code}" -X POST "$RENDER_HOOK")
        HTTP_CODE="${RESPONSE:${#RESPONSE}-3}"
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
          echo "✅ Automation Success! Render has initiated the deployment framework for service srv-dbinftvlk1mc73f7hfe0."
        else
          echo "❌ ERROR: Hook returned non-success HTTP status code: $HTTP_CODE"
          exit 1
        fi
