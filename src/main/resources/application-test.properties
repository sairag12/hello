# ===================================================================
# 🧪 HIGH-VELOCITY ISOLATED TEST PROFILE DATA SOURCE
# ===================================================================
spring.datasource.url=jdbc:h2:mem:enterprise_app;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 🛠️ BYPASS RUNNER MIGRATION SCRIPTS
# ===================================================================
# Disable Flyway for tests to prevent syntax mismatch crashing H2
spring.flyway.enabled=false

# ===================================================================
# 💾 TEST RUNTIME ORM GENERATION SETTINGS
# ===================================================================
# Let Hibernate create the structural tables dynamically out of your entity objects during tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
