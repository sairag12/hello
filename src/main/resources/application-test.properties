# ===================================================================
# 🧪 HIGH-VELOCITY ISOLATED TEST PROFILE DATA SOURCE
# ===================================================================
spring.datasource.url=jdbc:h2:mem:enterprise_app;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 🛠️ TEST CONTAINER FLYWAY ENFORCEMENT
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===================================================================
# 💾 TEST RUNTIME ORM SETTINGS
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
