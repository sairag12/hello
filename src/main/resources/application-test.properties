# ===================================================================
# 🧪 HIGH-VELOCITY ISOLATED TEST PROFILE DATA SOURCE
# ===================================================================
# Provision an in-memory SQL structure mimicking MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:enterprise_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 🛠️ TEST CONTAINER FLYWAY ENFORCEMENT
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# 💾 TEST RUNTIME ORM SETTINGS
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
