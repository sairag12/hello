# ===================================================================
# 💻 LOCAL DEVELOPMENT ENVIRONMENT (DEFAULT)
# ===================================================================
# This runs automatically on your laptop. Keep your old local setup here.
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hello
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# 🔒 RENDER CLOUD PRODUCTION PROFILE CONVERGENCE
# ===================================================================
# When SPRING_PROFILES_ACTIVE=prod is set in Render, it overrides the top block
# and safely reads the dashboard variables you just saved.
%prod.spring.datasource.url=${SPRING_DATASOURCE_URL}
%prod.spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
%prod.spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Secure production tracking rules required by Aiven MySQL clusters
%prod.spring.jpa.hibernate.ddl-auto=update
%prod.spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
