# ===================================================================
# 📊 SPRING CORE DATA SOURCE SUBSYSTEM CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 🛠️ DATABASE MIGRATION SYSTEM (FLYWAY CORE CONFIGURATION)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===================================================================
# 💾 ORM PERSISTENCE LAYER (JPA / HIBERNATE SPECIFICS)
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
